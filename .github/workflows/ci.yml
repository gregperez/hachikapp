# CI quality gate for base-golang
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (go.mod) and preferred toolchain (go.mod toolchain line).
        include:
          - go-version: "1.26.6"
            toolchain: local
            name: go-min
          - go-version: "1.27.1"
            toolchain: local
            name: go-preferred
    name: verify (${{ matrix.name }})
    services:
      postgres:
        # postgres:16-alpine (multi-arch index digest; pin for reproducibility)
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: base_golang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d base_golang_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Ephemeral CI credentials only; never log this value.
      DATABASE_TEST_URL: postgres://postgres:test@localhost:5432/base_golang_test?sslmode=disable
      GOWORK: "off"
      GOTOOLCHAIN: ${{ matrix.toolchain }}

    steps:
      # actions/checkout@v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-go@v5.4.0
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Install gitleaks
        env:
          # gitleaks_8.21.2_linux_x64.tar.gz from official checksums.txt
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tgz gitleaks
          gitleaks version

      - name: Verify
        run: make verify
