# CI quality gate for base-golang
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: base_golang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d base_golang_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Ephemeral CI credentials only; never log this value.
      DATABASE_TEST_URL: postgres://postgres:test@localhost:5432/base_golang_test?sslmode=disable
      GOWORK: "off"

    steps:
      # actions/checkout@v4.2.2
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-go@v5.4.0 — uses go.mod toolchain
      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Verify
        run: make verify
