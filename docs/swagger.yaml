host: localhost:8080
info:
  contact: {}
  description: 'API de Autenticación con JWT en Go con Arquitectura Hexagonal. Private
    routes require Authorization: Bearer <access_token>.'
  title: Mi API en Golang
  version: "1.0"
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: loginData
        required: true
        schema:
          $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto_inputs_auth.LoginRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens
          schema:
            allOf:
            - $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto.ResponseDto'
            - properties:
                data:
                  $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto.AuthDto'
              type: object
        "400":
          description: Malformed JSON or empty body
          schema:
            $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_httpapi.Problem'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_httpapi.Problem'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_httpapi.Problem'
      summary: User login
      tags:
      - Authentication
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh token family. Idempotent for invalid tokens.
      parameters:
      - description: Refresh token
        in: body
        name: refreshToken
        required: true
        schema:
          $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto_inputs_auth.RefreshTokenRequestDto'
      produces:
      - application/json
      responses:
        "204":
          description: Revoked
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_httpapi.Problem'
      summary: Logout / revoke refresh family
      tags:
      - Authentication
  /v1/auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Refreshes tokens using a refresh token (single-use rotation)
      parameters:
      - description: Refresh token
        in: body
        name: refreshToken
        required: true
        schema:
          $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto_inputs_auth.RefreshTokenRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: New tokens
          schema:
            allOf:
            - $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto.ResponseDto'
            - properties:
                data:
                  $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_controller_dto.AuthDto'
              type: object
        "401":
          description: Invalid refresh
          schema:
            $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_httpapi.Problem'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_WilsonSayago_base-golang_internal_infra_primary_httpapi.Problem'
      summary: Refresh JWT token
      tags:
      - Authentication
  /v1/roles:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of roles
      parameters:
      - default: 1
        description: Page number (>=1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size (1-100)
        in: query
        maximum: 100
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
