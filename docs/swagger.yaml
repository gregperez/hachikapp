      summary: Get role by ID
      tags:
      - Roles
    put:
      consumes:
      - application/json
      description: Updates an existing role with the provided details
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role details
        in: body
