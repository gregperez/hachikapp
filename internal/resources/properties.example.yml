# Template only — copy to properties.yml (gitignored) before running locally.
# Do not put real credentials in this file or commit properties.yml.
#
# Secret fields use ${ENV_VAR} placeholders expanded by initModules
# (os.ExpandEnv: $NAME or ${NAME}; no bash ${NAME:-default} syntax).
#
# Required environment variables:
#   DB_PASSWORD
#   JWT_ACCESS_SECRET   (>= 32 bytes, different from refresh)
#   JWT_REFRESH_SECRET  (>= 32 bytes, different from access)
#
# Optional environment variables (override the non-secret defaults below):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_SSLMODE, DB_MAX_CONNS
#   DATABASE_URL (when set, replaces host/port/name/user/password/sslmode for pool + migrations)
#   JWT_ISSUER, JWT_AUDIENCE, JWT_ACCESS_HOURS, JWT_REFRESH_HOURS, JWT_LEEWAY_SECONDS
#   APP_ENV (development|test|production), LOG_LEVEL, GIN_MODE
#   SERVER_ADDR, SERVER_READ_HEADER_TIMEOUT, SERVER_READ_TIMEOUT, SERVER_WRITE_TIMEOUT,
#   SERVER_IDLE_TIMEOUT, SERVER_SHUTDOWN_TIMEOUT
#   CORS_ALLOWED_ORIGINS (comma-separated), CORS_ALLOW_CREDENTIALS
#   SWAGGER_ENABLED (default false; must stay false in production)
#   PUBLIC_BASE_URL (public web origin for tag links; default http://localhost:3000; https in production)
#   TAG_VISITOR_PEPPER (secret for the visitor hash; production: >= 32 chars, not the dev default;
#     generate with: openssl rand -base64 48)
#   NOTIFICATIONS_ENABLED (default true; owner email notifications and the delivery worker)
#   SMTP_HOST (empty = emails are only logged), SMTP_PORT (default 587), SMTP_USER (enables AUTH PLAIN),
#   SMTP_PASSWORD (secret; never logged), SMTP_FROM (valid address). STARTTLS is mandatory except on
#     localhost. Production with notifications enabled requires SMTP_HOST and SMTP_FROM.
#
# Generate secrets, for example:
#   export DB_PASSWORD="$(openssl rand -base64 24)"
#   export JWT_ACCESS_SECRET="$(openssl rand -base64 48)"
#   export JWT_REFRESH_SECRET="$(openssl rand -base64 48)"
#
# Alternatively, for a local-only properties.yml you may temporarily replace
# ${...} with unequivocally fake placeholders such as:
#   change-me-with-32-random-bytes-access-token-value
#   change-me-with-32-random-bytes-refresh-token-value
# Never reuse values previously present in the repository history.

datasource:
  host: localhost
  port: "5432"
  database: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  # Local docker often uses disable; production validation rejects disable/allow/prefer.
  sslmode: disable
  dbMaxConns: 10

log:
  level: info

jwt:
  secret-key: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  expiration-time: 1
  refresh-token-time: 24
  issuer: change-me-issuer
  audience: change-me-audience
  leeway-seconds: 0

# Notifications are configured only through environment variables (read by appconfig,
# not by this file). Shown here as a reference of the equivalent section:
# notifications:
#   enabled: true            # NOTIFICATIONS_ENABLED
#   smtp:
#     host: ""               # SMTP_HOST (empty = log mailer)
#     port: 587              # SMTP_PORT
#     user: ""               # SMTP_USER
#     password: ${SMTP_PASSWORD}   # secret, never logged
#     from: ""               # SMTP_FROM
